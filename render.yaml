services:
  - type: web
    name: star-piggy-bank-sync
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: FAMILY_ID
        value: our-family
      - key: DATABASE_URL
        fromDatabase:
          name: star-piggy-bank-db
          property: connectionString

databases:
  - name: star-piggy-bank-db
    databaseName: star_piggy_bank
    user: star_piggy_bank
    plan: free
    region: singapore
    postgresMajorVersion: "18"
